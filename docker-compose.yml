version: '3.8'

services:
  landing:
    image: mrdevx/nn-landing:latest
    container_name: nn-landing
    restart: always
    ports:
      - "3030:3000"
    environment:
      - NODE_ENV=production
    networks:
      - nn_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  landing-nginx:
    image: nginx:alpine
    container_name: nn-landing-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - landing
    networks:
      - nn_network

networks:
  nn_network:
    name: nn_network
    driver: bridge 