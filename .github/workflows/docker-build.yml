name: Build and Push Docker Image

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'arm64,arm'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Enable Corepack
        run: corepack enable

      - name: Setup .yarnrc.yml
        run: cp .yarnrc.yml-example .yarnrc.yml

      - name: Install dependencies
        run: yarn install --immutable

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Get version
        id: package_version
        run: |
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/nn-landing:${{ steps.package_version.outputs.VERSION }}-${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/nn-landing:latest
          build-args: |
            NODE_ENV=${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}

      - name: Send Telegram notification on success
        if: success()
        run: |
          MESSAGE="🚀 Notable Nomads Landing Workflow Successful!%0A%0A"
          MESSAGE+="🏷 Version: ${{ env.VERSION }}%0A"
          MESSAGE+="📝 Commit: ${GITHUB_SHA::7}%0A"
          MESSAGE+="👤 Author: ${{ github.actor }}%0A"
          MESSAGE+="🔗 Commit URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}%0A%0A"
          MESSAGE+="🌍 Landing Page: https://notablenomads.com"
          MESSAGE+="📦 Docker Image: mrdevx/nn-landing:${{ env.VERSION }}-${GITHUB_SHA::7}"

          curl -s -X POST \
            https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d message_thread_id=${{ secrets.TELEGRAM_THREAD_ID }} \
            -d text="$MESSAGE" \
            -d parse_mode=HTML

      - name: Send Telegram notification on failure
        if: failure()
        run: |
          MESSAGE="❌ Notable Nomads Landing Workflow Failed!%0A%0A"
          MESSAGE+="🏷 Version: ${{ env.VERSION }}%0A"
          MESSAGE+="📝 Commit: ${GITHUB_SHA::7}%0A"
          MESSAGE+="👤 Author: ${{ github.actor }}%0A"
          MESSAGE+="🔗 Action URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}%0A%0A"
          MESSAGE+="Please check the GitHub Actions logs for more details."

          curl -s -X POST \
            https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d message_thread_id=${{ secrets.TELEGRAM_THREAD_ID }} \
            -d text="$MESSAGE" \
            -d parse_mode=HTML 