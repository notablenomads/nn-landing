version: '3.8'

services:
  web:
    image: mrdevx/nn-landing:latest
    restart: always
    ports:
      - "3030:3000"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3 