version: 1
backend:
  phases:
    build:
      commands:
        - yarn set version stable
        - yarn install --immutable
        - yarn dlx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .yarn/cache/**/*
      - node_modules/**/*
